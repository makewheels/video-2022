[project]
name = "video-serverless"
version = "0.1.0"
description = "Isolated FC API prototype for video-2022; not production"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.11,<5",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
video-serverless-benchmark = "video_serverless.benchmark:main"
video-serverless-startup = "video_serverless.startup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_serverless"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
