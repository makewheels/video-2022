[project]
name = "video-transcode-worker"
version = "0.1.0"
description = "GPU HLS transcode prototype for video-2022"
requires-python = ">=3.12"
dependencies = ["oss2>=2.18,<3", "requests>=2.32,<3"]

[project.scripts]
video-transcode-worker = "video_transcode_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_transcode_worker"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16.3"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
