name: 函数部署

# 自建 CPU/GPU 转码函数的镜像构建与 FC 部署。
# 构建可随时手动触发；FC 部署需要 Infisical 中已配置 FC_DEPLOY_AK_*。
# 见 docs/requirements/2026-10-gpu-cloudfunction-transcode/PLAN.md P3。
on:
  workflow_dispatch:
    inputs:
      target:
        description: 部署目标环境（Infisical env-slug）
        required: true
        default: prod
        type: choice
        options: [ dev, prod ]
      functions:
        description: 要部署的函数
        required: true
        default: both
        type: choice
        options: [ cpu, gpu, both ]
      image_tag:
        description: 复用或回滚的已有镜像标签（skip_build 时必填，禁止 latest）
        required: false
        type: string
      skip_build:
        description: 跳过镜像构建（复用上一 tag）
        required: false
        default: false
        type: boolean

env:
  ACR: registry.cn-beijing.aliyuncs.com
  REGION: cn-beijing

jobs:
  build-and-push:
    name: 构建函数镜像
    if: ${{ !github.event.inputs.skip_build || github.event.inputs.skip_build == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v5

      - name: 从 common 读取镜像仓库凭据
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ github.ref == 'refs/heads/feature/cloud-function-transcode' && vars.INFISICAL_TRANSCODE_FUNCTIONS_IDENTITY_ID || '322a3702-73a7-4bbe-8f55-ebd6376e15d4' }}
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ github.ref == 'refs/heads/feature/cloud-function-transcode' && 'video-2022-transcode-functions' || 'common-shared' }}
          env-slug: ${{ github.ref == 'refs/heads/feature/cloud-function-transcode' && 'prod' || 'dev' }}
          secret-path: ${{ github.ref == 'refs/heads/feature/cloud-function-transcode' && '/' || '/deployment' }}

      - name: 生成镜像标签
        id: meta
        run: |
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y%m%d-%H%M%S')
          RUN_NUM=$(printf '%04d' ${{ github.run_number }})
          echo "image_tag=${BEIJING_TIME}-${RUN_NUM}" >> "$GITHUB_OUTPUT"

      - name: 登录镜像仓库
        run: |
          printf '%s' "$ACR_AK_SECRET" | docker login \
            --username "$ACR_AK_ID" --password-stdin "$ACR" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送 CPU 镜像
        if: github.event.inputs.functions != 'gpu'
        uses: docker/build-push-action@v7
        with:
          context: functions
          file: functions/cpu/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR }}/b4/video-2022-func-cpu:latest
            ${{ env.ACR }}/b4/video-2022-func-cpu:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=func-cpu
          cache-to: type=gha,scope=func-cpu,mode=max
          provenance: false

      - name: 构建并推送 GPU 镜像
        if: github.event.inputs.functions != 'cpu'
        uses: docker/build-push-action@v7
        with:
          context: functions
          file: functions/gpu/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR }}/b4/video-2022-func-gpu:latest
            ${{ env.ACR }}/b4/video-2022-func-gpu:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=func-gpu
          cache-to: type=gha,scope=func-gpu,mode=max
          provenance: false

      - name: 清理 Runner registry 登录
        if: always()
        run: docker logout "$ACR" >/dev/null 2>&1 || true

  fc-deploy:
    name: 部署 FC 函数
    needs: [ build-and-push ]
    # skip_build 时 build job 被 skip，不算失败，部署照常跑（必须指定已有版本标签）
    if: ${{ !cancelled() && needs.build-and-push.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: 读取函数运行配置与部署身份
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ github.ref == 'refs/heads/feature/cloud-function-transcode' && vars.INFISICAL_TRANSCODE_FUNCTIONS_IDENTITY_ID || '322a3702-73a7-4bbe-8f55-ebd6376e15d4' }}
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ github.ref == 'refs/heads/feature/cloud-function-transcode' && 'video-2022-transcode-functions' || 'video-2022-secrets' }}
          env-slug: ${{ github.event.inputs.target }}
          secret-path: /
          recursive: true

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
      - name: 校验复用镜像版本
        env:
          REUSE_TAG: ${{ inputs.image_tag }}
          SKIP_BUILD: ${{ inputs.skip_build }}
        run: |
          if [ "$SKIP_BUILD" = true ]; then
            [[ "$REUSE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]+$ ]] && [ "$REUSE_TAG" != latest ]
          fi

      - name: 安装 aliyun CLI
        run: |
          curl -sSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o cli.tgz
          tar xzf cli.tgz
          sudo install aliyun /usr/local/bin/aliyun

      - name: 配置 aliyun 凭据（FC 部署专用子账号）
        run: |
          aliyun configure set --profile default \
            --mode AK --access-key-id "$FC_DEPLOY_AK_ID" \
            --access-key-secret "$FC_DEPLOY_AK_SECRET" --region $REGION

      - name: 部署 CPU 函数
        if: github.event.inputs.functions != 'gpu'
        env:
          IMAGE: ${{ env.ACR }}/b4/video-2022-func-cpu:${{ needs.build-and-push.outputs.image_tag || inputs.image_tag }}
          FN: video-2022-${{ github.event.inputs.target }}-transcode-cpu
        run: |
          bash functions/deploy/fc_upsert.sh \
            "$FN" "$IMAGE" "" "${{ github.event.inputs.target }}"

      - name: 部署 GPU 函数
        if: github.event.inputs.functions != 'cpu'
        env:
          IMAGE: ${{ env.ACR }}/b4/video-2022-func-gpu:${{ needs.build-and-push.outputs.image_tag || inputs.image_tag }}
          FN: video-2022-${{ github.event.inputs.target }}-transcode-gpu
        run: |
          bash functions/deploy/fc_upsert.sh \
            "$FN" "$IMAGE" "gpu" "${{ github.event.inputs.target }}"

      - name: 摘要
        run: |
          {
            echo "### 函数部署（${{ github.event.inputs.target }}）"
            echo "- 镜像 tag: \`${{ needs.build-and-push.outputs.image_tag }}\`"
            echo "- 回滚：使用 skip_build=true 与 image_tag 指定上一已验证标签执行本 workflow"
          } >> "$GITHUB_STEP_SUMMARY"
