name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 代码质量门禁
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Run ruff (ai-agent)
        working-directory: ai-agent
        run: uv run ruff check

      - name: Run ruff (cli)
        working-directory: cli
        run: uv run ruff check

      - name: Run ruff (test)
        working-directory: test
        run: uv run ruff check

      - name: Check file length
        run: uv run --no-project python scripts/check_file_length.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        working-directory: server
        run: mvn -q checkstyle:check --batch-mode --no-transfer-progress

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Lint web
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run lint

  backend-tests:
    name: 后端测试
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: server
        run: >-
          mvn test -pl video -Pspringboot
          --batch-mode --no-transfer-progress

  frontend-tests:
    name: 前端测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: web
        run: pnpm exec vitest run

  # 构建产物，供 E2E 测试共享
  build-e2e-artifacts:
    name: 构建 E2E 产物
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Build backend
        working-directory: server
        run: >-
          mvn clean package -pl video -Pspringboot
          -Dmaven.test.skip=true
          --batch-mode --no-transfer-progress

      - name: Upload backend JAR
        uses: actions/upload-artifact@v5
        with:
          name: backend-jar
          path: server/video/target/video-0.0.1-SNAPSHOT.jar
          retention-days: 1

      - name: Upload frontend build
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: server/video/src/main/resources/static
          retention-days: 1

  api-e2e-tests:
    name: API E2E 测试
    needs: build-e2e-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: 从 Infisical 读取开发配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 322a3702-73a7-4bbe-8f55-ebd6376e15d4
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: video-2022-secrets
          env-slug: dev
          secret-path: /ci
          recursive: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download backend JAR
        uses: actions/download-artifact@v5
        with:
          name: backend-jar
          path: server/video/target

      - name: Start backend
        working-directory: server/video/target
        run: |
          java -jar video-0.0.1-SNAPSHOT.jar &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5022/healthCheck && break || sleep 2
          done

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: test/uv.lock

      - name: Run API E2E tests
        working-directory: test
        run: uv run pytest api/ -v --tb=short

  browser-e2e-tests:
    name: 浏览器 E2E 测试
    needs: build-e2e-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: 从 Infisical 读取开发配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: 322a3702-73a7-4bbe-8f55-ebd6376e15d4
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: video-2022-secrets
          env-slug: dev
          secret-path: /ci
          recursive: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download backend JAR
        uses: actions/download-artifact@v5
        with:
          name: backend-jar
          path: server/video/target

      - name: Download frontend build
        uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: server/video/src/main/resources/static

      - name: Start backend
        working-directory: server/video/target
        run: |
          java -jar video-0.0.1-SNAPSHOT.jar &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5022/healthCheck && break || sleep 2
          done

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: test/uv.lock

      - name: Install test dependencies
        working-directory: test
        run: uv sync

      - name: Read Playwright version
        id: playwright-version
        working-directory: test
        run: |
          echo "version=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright system deps
        timeout-minutes: 5
        working-directory: test
        run: |
          uv run python -m playwright install-deps chromium

      - name: Install Playwright browsers
        timeout-minutes: 10
        working-directory: test
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]; then
            echo "Playwright browser cache hit: ${{ steps.playwright-version.outputs.version }}"
          else
            echo "Playwright browser cache miss: ${{ steps.playwright-version.outputs.version }}"
          fi
          uv run python -m playwright install chromium

      - name: Run browser E2E tests
        working-directory: test
        run: uv run pytest browser/ -v --tb=short

  cli-tests:
    name: CLI 工具测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: Run CLI tests
        working-directory: cli
        run: uv run --extra test pytest tests/ -v --tb=short

  ai-agent-tests:
    name: AI Agent 测试
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: ai-agent/uv.lock

      - name: Run AI Agent tests
        working-directory: ai-agent
        run: uv run pytest tests/ -v --tb=short

  android-tests:
    name: Android 单元测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

  ios-tests:
    name: iOS 单元测试
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 16
        run: |
          ls /Applications/Xcode*.app/Contents/Developer 2>/dev/null | head -5
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 16 found, using default"
          else
            echo "Using $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run iOS unit tests
        working-directory: ios
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import sys,json
          data=json.load(sys.stdin)
          for runtime,devs in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devs:
                      if d.get('isAvailable') and 'iPhone' in d['name']:
                          print(f\"platform=iOS Simulator,id={d['udid']}\")
                          sys.exit(0)
          " || echo "platform=iOS Simulator,name=iPhone 15,OS=latest")
          echo "Using destination: $DEST"
          xcodebuild test \
            -project VideoApp.xcodeproj \
            -scheme VideoApp \
            -destination "$DEST" \
            -only-testing:VideoAppTests \
            -quiet

  build-and-test:
    name: build-and-test
    needs: [lint, backend-tests, frontend-tests, api-e2e-tests, browser-e2e-tests, cli-tests, ai-agent-tests, android-tests, ios-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ] || \
             [ "${{ needs.api-e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.browser-e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.cli-tests.result }}" != "success" ] || \
             [ "${{ needs.ai-agent-tests.result }}" != "success" ] || \
             [ "${{ needs.android-tests.result }}" != "success" ] || \
             [ "${{ needs.ios-tests.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
