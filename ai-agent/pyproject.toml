[project]
name = "ai-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "motor>=3.0.0",
    "openai>=1.0.0",
    "oss2>=2.18.4",
    "pymongo>=4.0.0",
    "requests>=2.31.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "click>=8.4.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
