[project]
name = "ai-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "motor>=3.0.0",
    "openai>=1.0.0",
    "oss2>=2.18.4",
    "pymongo>=4.0.0",
    "requests>=2.31.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
# Langfuse trace 观测（video_agent/trace.py；未装或未配 LANGFUSE_* 时整体 no-op）
langfuse = [
    "langfuse>=4",
]

[dependency-groups]
dev = [
    "click>=8.4.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E501", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10
